name: Build FlClash 二次开发

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.4'
  GO_VERSION: '1.26.4'

jobs:
  build-android:
    name: android-apk
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Clone upstream FlClash
        run: git clone --depth 1 https://github.com/chen08209/FlClash.git FlClash

      - name: Apply pinxixi patches
        run: python _prepare_source.py

      - name: Init submodules
        working-directory: FlClash
        run: git submodule update --init --recursive --depth 1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build Android APK
        working-directory: FlClash
        run: |
          flutter pub get
          dart setup.dart android -v
          flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flclash-dev-apk
          path: FlClash/dist/**/*.apk
          if-no-files-found: error

  build-macos:
    name: macos-${{ matrix.arch }}-dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clone upstream FlClash
        run: git clone --depth 1 https://github.com/chen08209/FlClash.git FlClash

      - name: Apply pinxixi patches
        run: python _prepare_source.py

      - name: Init submodules
        working-directory: FlClash
        run: git submodule update --init --recursive --depth 1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app || true
          xcodebuild -version

      - name: Build macOS DMG
        working-directory: FlClash
        run: |
          flutter pub get
          dart setup.dart macos -v

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: flclash-dev-macos-${{ matrix.arch }}-dmg
          path: FlClash/dist/*.dmg
          if-no-files-found: error

  release:
    needs: [build-android, build-macos]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.8.96-dev.1
          name: FlClash 二次开发
          body: |
            拼夕夕定制 · 包名 com.wzpxx.flclash.dev
            Android APK + macOS DMG（Apple Silicon / Intel）
            拼夕夕订阅默认 5 分钟自动更新、直连拉取
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
