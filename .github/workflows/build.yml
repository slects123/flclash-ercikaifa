name: Build FlClash 二次开发 (Android)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.4'
  GO_VERSION: '1.26.4'

jobs:
  build-android:
    name: android-apk
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Clone upstream FlClash
        run: git clone --depth 1 https://github.com/chen08209/FlClash.git FlClash

      - name: Apply pinxixi patches
        run: python _prepare_source.py

      - name: Init submodules
        working-directory: FlClash
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build Android APK
        working-directory: FlClash
        run: |
          flutter pub get
          printf '%s' '{"APP_ENV":"stable"}' > env.json
          dart setup.dart android --env stable -v
          printf '%s' '{"APP_ENV":"stable"}' > env.json
          flutter build apk --release --split-per-abi \
            --dart-define-from-file=env.json \
            --dart-define=APP_ENV=stable
          mkdir -p dist
          find build -name '*.apk' -print
          cp -f build/app/outputs/flutter-apk/*.apk dist/ || true
          cp -f build/app/outputs/apk/release/*.apk dist/ || true
          ls -lah dist || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flclash-dev-apk
          path: |
            FlClash/dist/**/*.apk
            FlClash/build/app/outputs/flutter-apk/*.apk
            FlClash/build/app/outputs/apk/release/*.apk
          if-no-files-found: error
